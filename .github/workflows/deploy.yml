# main is the deploy branch: every push to it (a merged develop → main PR)
# builds again and, only if that passes, deploys to Vercel production.
#
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN       a Vercel access token
#   VERCEL_ORG_ID      from .vercel/project.json after `vercel link`
#   VERCEL_PROJECT_ID  from .vercel/project.json after `vercel link`
# NEXT_PUBLIC_API_URL is set in the Vercel project's Production environment.
# Turn off Vercel's own Git auto-deploys so this workflow is the only path.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Check Vercel is configured
        id: check
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID not set — building only, nothing deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build (no Vercel yet)
        if: steps.check.outputs.ready != 'true'
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid
        run: npm run build
      - name: Build and deploy to Vercel production
        if: steps.check.outputs.ready == 'true'
        run: |
          npm install -g vercel
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
