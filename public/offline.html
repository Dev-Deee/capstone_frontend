<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0c1f4a" />
  <title>Offline · Cadence</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f9fafb; color: #111827;
    }
    .card { max-width: 360px; text-align: center; }
    .tile {
      width: 56px; height: 56px; margin: 0 auto 20px; border-radius: 14px; background: #0c1f4a;
      display: grid; place-items: center; color: #fff;
    }
    h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 8px; }
    p { font-size: 14px; line-height: 1.55; color: #6b7280; margin: 0 0 20px; }
    button {
      font: inherit; font-size: 14px; font-weight: 500; color: #fff; background: #2563eb;
      border: 0; border-radius: 8px; padding: 9px 16px; cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    @media (prefers-color-scheme: dark) {
      body { background: #13151d; color: #eceff5; }
      p { color: #90989f; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="tile" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12h4l2-5 4 10 2-5h6" />
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>Cadence needs a connection to load your classes and updates. Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
